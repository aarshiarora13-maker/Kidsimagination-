<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>KidsImagination — Personalized Storybooks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">

<style>
:root{
  --purple:#7654e8;
  --purple-dark:#5439a8;
  --pink:#ff69a9;
  --yellow:#ffd85a;
  --blue:#63c9ff;
  --ink:#30264d;
  --cream:#fffaf0
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  color:var(--ink);
  font-family:Nunito,Arial,sans-serif;
  background:var(--cream);
  overflow-x:hidden;
  font-size:16px
}

a{
  color:inherit
}

h1,h2,h3,.logo,.btn{
  font-family:"Baloo 2",sans-serif
}

.container{
  width:min(1120px,92%);
  margin:0 auto
}

/* NAVIGATION */

.navbar{
  background:#fff;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 4px 20px rgba(48,38,77,.08)
}

.nav-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px
}

.logo{
  font-size:25px;
  font-weight:800;
  color:var(--purple);
  white-space:nowrap
}

.logo span{
  margin-right:6px
}

.nav-links{
  display:flex;
  align-items:center;
  gap:24px
}

.nav-links a{
  text-decoration:none;
  font-weight:800;
  font-size:15px
}

.nav-cta{
  background:var(--purple);
  color:#fff!important;
  padding:10px 18px;
  border-radius:14px;
  box-shadow:0 4px 0 var(--purple-dark)
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  padding:70px 0 85px;
  background:linear-gradient(
    135deg,
    #fff1a4 0%,
    #ffe0ee 52%,
    #dff5ff 100%
  )
}

.hero:before{
  content:"✨  ⭐  🌈  ⭐  ✨";
  position:absolute;
  right:5%;
  top:28px;
  font-size:22px;
  letter-spacing:5px
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .75fr;
  align-items:center;
  gap:50px
}

.badge{
  display:inline-block;
  background:var(--pink);
  color:#fff;
  padding:7px 16px;
  border-radius:999px;
  font-weight:800;
  font-size:15px;
  box-shadow:0 4px 0 rgba(84,57,168,.18)
}

.hero h1{
  font-size:clamp(44px,6vw,70px);
  line-height:1.02;
  margin:18px 0 20px;
  color:var(--purple);
  text-shadow:3px 3px #fff
}

.hero p{
  font-size:19px;
  line-height:1.65;
  max-width:680px;
  margin:0 0 26px
}

.actions{
  display:flex;
  gap:14px;
  flex-wrap:wrap
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  border:0;
  cursor:pointer;
  border-radius:16px;
  padding:13px 20px;
  font-weight:800;
  font-size:17px;
  box-shadow:0 5px 0 var(--purple-dark);
  min-height:50px
}

.primary{
  background:var(--purple);
  color:#fff
}

.soft{
  background:#fff;
  color:var(--purple);
  border:2px solid #e1d9ff;
  box-shadow:0 5px 0 #d0c4f8
}

.book-demo{
  background:#fff;
  border-radius:28px;
  padding:25px;
  box-shadow:0 18px 45px rgba(48,38,77,.14);
  transform:rotate(2deg);
  max-width:330px;
  margin:auto;
  text-align:center
}

.book-demo h3{
  font-size:29px;
  color:var(--purple);
  margin:0 0 14px
}

.book-face{
  font-size:105px;
  line-height:1
}

.book-demo p{
  font-size:17px;
  margin:15px 0 0
}

/* SECTIONS */

.section{
  padding:72px 0
}

.section-head{
  text-align:center;
  max-width:720px;
  margin:0 auto 38px
}

.section-head h2{
  font-size:42px;
  line-height:1.1;
  color:var(--purple);
  margin:0 0 10px
}

.section-head p{
  font-size:18px;
  line-height:1.6;
  margin:0
}

/* STEPS */

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px
}

.step{
  background:#fff;
  border-radius:24px;
  padding:24px;
  text-align:center;
  box-shadow:0 12px 30px rgba(48,38,77,.08)
}

.num{
  display:flex;
  width:52px;
  height:52px;
  margin:0 auto 12px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--yellow);
  font:800 25px "Baloo 2"
}

.step h3{
  font-size:22px;
  margin:8px 0
}

.step p{
  line-height:1.5;
  margin:0
}

/* EXAMPLE STORY */

.example-section{
  background:linear-gradient(
    135deg,
    #fff3bd,
    #ffe4f0,
    #e3f7ff
  )
}

.example-card{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:32px;
  align-items:center;
  background:#fff;
  border-radius:28px;
  padding:28px;
  box-shadow:0 16px 40px rgba(48,38,77,.1)
}

.example-copy h3{
  font-size:35px;
  line-height:1.1;
  color:var(--purple);
  margin:14px 0 10px
}

.example-copy p{
  font-size:17px;
  line-height:1.65;
  margin:0 0 22px
}

.example-copy .btn{
  width:max-content
}

.story-link{
  margin-top:14px;
  display:block;
  font-weight:800;
  color:var(--purple);
  text-decoration:none
}

/* IMPORTANT:
   We are not using the old /examples/ path.
   Bhavik's story is in the root folder.
*/

.example-story-buttons{
  display:flex;
  flex-direction:column;
  align-items:flex-start
}

/* STORY PREVIEW */

.story-preview{
  background:#faf8ff;
  border-radius:20px;
  padding:20px;
  text-align:center
}

.story-preview-icon{
  font-size:100px;
  line-height:1
}

.story-preview h4{
  font-family:"Baloo 2",sans-serif;
  font-size:25px;
  color:var(--purple);
  margin:10px 0
}

.story-preview p{
  margin:0;
  font-size:15px
}

/* PRICING */

.pricing-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.price-card{
  background:#fff;
  border-radius:26px;
  padding:26px;
  box-shadow:0 12px 32px rgba(48,38,77,.08);
  border:2px solid #eee;
  text-align:center
}

.price-card.featured{
  border-color:var(--blue);
  background:#f2fbff
}

.price-card h3{
  font-size:22px;
  margin:0 0 5px
}

.cost{
  font:800 38px "Baloo 2";
  color:var(--purple);
  margin:8px 0
}

.price-card ul{
  text-align:left;
  line-height:1.75;
  margin:16px 0;
  padding-left:20px
}

.price-card .btn{
  width:100%
}

/* CREATE */

.create-section{
  background:linear-gradient(
    135deg,
    #eee6ff,
    #ffe8f2
  )
}

.wizard{
  width:min(820px,100%);
  margin:auto;
  background:#fff;
  border-radius:28px;
  padding:30px;
  box-shadow:0 15px 40px rgba(48,38,77,.1)
}

.field{
  margin-bottom:18px
}

.field label{
  display:block;
  font-weight:800;
  font-size:16px;
  margin-bottom:7px
}

.field input,
.field select,
.field textarea{
  display:block;
  width:100%;
  padding:12px 14px;
  border:2px solid #e5e0f0;
  border-radius:13px;
  background:#fff;
  color:var(--ink);
  font:600 16px Nunito;
  outline:none
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--purple)
}

.upload{
  border:2px dashed #cfc3f5;
  border-radius:18px;
  background:#fbf9ff;
  padding:18px
}

.upload input{
  margin-top:12px;
  width:100%
}

.wizard .btn{
  width:100%;
  margin-top:3px
}

/* IDENTITY */

.identity{
  text-align:center
}

.identity p{
  max-width:760px;
  margin:0 auto;
  font-size:17px;
  line-height:1.65
}

.note{
  background:#fff7d7;
  border:1px solid #f0df99;
  border-radius:15px;
  padding:12px 15px;
  margin-top:18px;
  font-size:14px;
  line-height:1.5
}

/* FOOTER */

footer{
  background:var(--ink);
  color:#fff;
  padding:38px 0;
  text-align:center
}

footer .logo{
  color:#fff
}

footer p{
  margin:8px 0;
  opacity:.85
}

/* TABLET */

@media(max-width:850px){

  .nav-links a:not(.nav-cta){
    display:none
  }

  .hero{
    padding:55px 0 65px
  }

  .hero-grid{
    grid-template-columns:1fr;
    gap:35px
  }

  .hero:before{
    position:static;
    display:block;
    text-align:center;
    margin-bottom:5px
  }

  .hero h1{
    font-size:clamp(42px,12vw,58px)
  }

  .hero p{
    font-size:17px
  }

  .book-demo{
    transform:none
  }

  .steps,
  .pricing-grid{
    grid-template-columns:1fr 1fr
  }

  .example-card{
    grid-template-columns:1fr
  }

  .example-copy{
    text-align:center
  }

  .example-copy .btn{
    width:100%
  }

  .example-story-buttons{
    align-items:stretch
  }

  .section{
    padding:58px 0
  }

  .section-head h2{
    font-size:35px
  }
}

/* MOBILE */

@media(max-width:560px){

  body{
    font-size:15px
  }

  .nav-inner{
    min-height:64px
  }

  .logo{
    font-size:22px
  }

  .nav-cta{
    padding:9px 14px;
    font-size:15
