<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>KidsImagination Story</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f8f3ff,
      #fffaf2
    );

  color:#25213a;

}

.wrap{

  max-width:900px;

  margin:25px auto;

  padding:15px;

}

.card{

  background:#ffffff;

  border-radius:28px;

  padding:25px;

  box-shadow:
    0 10px 35px #0001;

}

.header{

  text-align:center;

}

.header h1{

  margin:
    0 0 8px;

  color:#5b42c7;

  font-size:30px;

}

.header h2{

  margin:
    5px 0 10px;

  font-size:22px;

}

.header p{

  margin:
    0 0 18px;

  color:#666;

}

.bar{

  height:10px;

  background:#e5e1f0;

  border-radius:20px;

  overflow:hidden;

}

.fill{

  height:100%;

  width:5%;

  background:
    linear-gradient(
      90deg,
      #7156d8,
      #9a7df2
    );

  border-radius:20px;

  transition:
    width .4s ease;

}

/* =====================================================
   DOWNLOAD AREA
   ===================================================== */

.download-area{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:12px;

  margin:
    25px 0 30px;

}

.btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-height:48px;

  padding:
    13px 22px;

  border-radius:15px;

  border:0;

  text-decoration:none;

  font-weight:800;

  font-size:16px;

  cursor:pointer;

  background:#7156d8;

  color:white;

  box-shadow:
    0 5px 15px #7156d833;

}

.btn:hover{

  transform:
    translateY(-1px);

}

.btn.audio{

  background:#f5c94a;

  color:#342800;

  box-shadow:
    0 5px 15px #f5c94a55;

}

/* =====================================================
   STORY PAGE
   ===================================================== */

.book{

  margin-top:10px;

}

.page{

  position:relative;

  margin:
    30px 0 42px;

  background:#fff;

  border-radius:24px;

  overflow:hidden;

  box-shadow:
    0 8px 30px #0002;

}

.page-number{

  position:absolute;

  left:15px;

  top:15px;

  width:38px;

  height:38px;

  border-radius:50%;

  background:#7156d8;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:900;

  font-size:14px;

  z-index:10;

  box-shadow:
    0 4px 12px #0003;

}

.page-image{

  display:block;

  width:100%;

  height:auto;

  margin:0;

}

/* =====================================================
   PAGE AUDIO
   ===================================================== */

.page-audio{

  background:
    linear-gradient(
      135deg,
      #fffdf3,
      #fff8cf
    );

  padding:
    14px 16px;

  border-top:
    1px solid #eee;

}

.page-audio-title{

  text-align:center;

  font-weight:800;

  color:#5b42c7;

  margin:
    0 0 8px;

  font-size:15px;

}

.page-audio audio{

  display:block;

  width:100%;

  height:44px;

}

/* =====================================================
   COMPLETE AUDIOBOOK
   ===================================================== */

.complete-audio{

  margin:
    30px 0;

  padding:20px;

  border-radius:20px;

  background:#fff9d9;

  text-align:center;

}

.complete-audio h3{

  margin:
    0 0 12px;

  color:#574300;

}

.complete-audio audio{

  width:100%;

  max-width:600px;

}

/* =====================================================
   BOTTOM DOWNLOAD
   ===================================================== */

.bottom-download{

  text-align:center;

  padding:
    10px 0 30px;

}

/* =====================================================
   LOADING
   ===================================================== */

.loading{

  padding:45px 20px;

  text-align:center;

  color:#666;

  font-size:17px;

}

/* =====================================================
   FAILED
   ===================================================== */

.error{

  padding:20px;

  border-radius:16px;

  background:#fff0f0;

  color:#b42318;

  text-align:center;

  font-weight:700;

}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  .wrap{

    padding:8px;

    margin:10px auto;

  }

  .card{

    padding:14px;

    border-radius:20px;

  }

  .header h1{

    font-size:25px;

  }

  .header h2{

    font-size:19px;

  }

  .download-area{

    flex-direction:column;

  }

  .btn{

    width:100%;

  }

  .page{

    margin:
      22px 0 30px;

    border-radius:18px;

  }

  .page-number{

    left:10px;

    top:10px;

    width:34px;

    height:34px;

  }

}

</style>

</head>


<body>

<div class="wrap">

  <div class="card">

    <div class="header">

      <h1>
        ✨ KidsImagination
      </h1>

      <h2 id="title">
        Creating your story…
      </h2>

      <p id="msg">
        Please keep this page open.
      </p>

      <div class="bar">

        <div
          id="fill"
          class="fill"
        ></div>

      </div>

    </div>


    <div
      id="book"
      class="book"
    >

      <div class="loading">

        📖 Your personalized story is being created…

      </div>

    </div>

  </div>

</div>


<script>

const id =
  new URLSearchParams(
    location.search
  ).get('order');


const msg =
  document.querySelector(
    '#msg'
  );


const fill =
  document.querySelector(
    '#fill'
  );


const book =
  document.querySelector(
    '#book'
  );


const title =
  document.querySelector(
    '#title'
  );


let n = 0;


// =====================================================
// ESCAPE HTML
// =====================================================

function esc(value){

  return String(
    value ?? ''
  )
  .replace(
    /[&<>"']/g,
    char =>
      ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[char])
  );

}


// =====================================================
// RENDER READY BOOK
// =====================================================

function renderBook(d){

  title.textContent =
    d.title ||
    'Your personalized story is ready! 🎉';

  msg.textContent =
    'Your complete personalized story is ready.';

  fill.style.width =
    '100%';


  let pagesHtml = '';


  if(
    Array.isArray(d.pages)
  ){

    pagesHtml =
      d.pages
        .map(
          (page,index) => {

            return `

              <section
                class="page"
              >

                <div
                  class="page-number"
                >
                  ${index + 1}
                </div>


                <img
                  class="page-image"
                  src="${esc(
                    page.imageUrl
                  )}"
                  alt="Story illustration page ${
                    index + 1
                  }"
                  loading="lazy"
                >


                ${
                  page.audioUrl
                    ? `

                      <div
                        class="page-audio"
                      >

                        <div
                          class="page-audio-title"
                        >
                          🎧 Listen to Page ${
                            index + 1
                          }
                        </div>

                        <audio
                          controls
                          preload="none"
                          src="${esc(
                            page.audioUrl
                          )}"
                        ></audio>

                      </div>

                    `
                    : ''
                }

              </section>

            `;

          }
        )
        .join('');

  }


  /*
   * PDF DOWNLOAD
   */

  const pdfButton =
    d.pdfUrl
      ? `

        <a
          class="btn"
          href="${esc(
            d.pdfUrl
          )}"
          download
        >
          📥 Download Complete PDF Storybook
        </a>

      `
      : `

        <span
          class="btn"
          style="
            opacity:.5;
            cursor:not-allowed;
          "
        >
          📥 PDF is being prepared…
        </span>

      `;


  /*
   * COMPLETE AUDIOBOOK
   */

  const audiobookButton =
    d.audioUrl
      ? `

        <a
          class="btn audio"
          href="${esc(
            d.audioUrl
          )}"
          download
        >
          🎧 Download Complete Audiobook
        </a>

      `
      : '';


  const audiobookPlayer =
    d.audioUrl
      ? `

        <div
          class="complete-audio"
        >

          <h3>
            🎧 Listen to the Complete Audiobook
          </h3>

          <audio
            controls
            preload="none"
            src="${esc(
              d.audioUrl
            )}"
          ></audio>

        </div>

      `
      : '';


  book.innerHTML = `

    <!-- =========================================
         DOWNLOAD BUTTONS AT TOP
         ========================================= -->

    <div
      class="download-area"
    >

      ${pdfButton}

      ${audiobookButton}

    </div>


    <!-- =========================================
         COMPLETE AUDIOBOOK PLAYER
         ========================================= -->

    ${audiobookPlayer}


    <!-- =========================================
         SIX ILLUSTRATED STORY PAGES
         Each page has its own audio.
         ========================================= -->

    ${pagesHtml}


    <!-- =========================================
         DOWNLOAD BUTTON AT BOTTOM
         ========================================= -->

    <div
      class="bottom-download"
    >

      ${pdfButton}

    </div>

  `;

}


// =====================================================
// POLL
// =====================================================

async function poll(){

  n++;

  if(!id){

    title.textContent =
      'Story not found';

    msg.textContent =
      'No story order was provided.';

    fill.style.width =
      '0%';

    return;

  }

  try{

    const response =
      await fetch(
        '/api/story/' +
        encodeURIComponent(id) +
        '?t=' +
        Date.now()
      );


    if(!response.ok){

      throw new Error(
        'Story status request failed'
      );

    }


    const d =
      await response.json();


    // =================================================
    // READY
    // =================================================

    if(
      d.status === 'ready'
    ){

      renderBook(d);

      return;

    }


    // =================================================
    // FAILED
    // =================================================

    if(
      d.status === 'failed'
    ){

      title.textContent =
        'Something went wrong';

      msg.textContent =
        'We could not finish your story.';

      fill.style.width =
        '0%';

      book.innerHTML = `

        <div
          class="error"
        >

          ❌ ${
            esc(
              d.error ||
              'Story generation failed.'
            )
          }

        </div>

      `;

      return;

    }


    // =================================================
    // GENERATING
    // =================================================

    fill.style.width =
      Math.min(
        92,
        5 + n * 2
      ) + '%';


    msg.textContent =
      'Creating your connected story, illustrations and audio…';


    setTimeout(
      poll,
      3000
    );


  }catch(error){

    console.error(
      error
    );

    setTimeout(
      poll,
      4000
    );

  }

}


// =====================================================
// START
// =====================================================

poll();

</script>

</body>

</html>
