<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidsImagination Story</title><style>body{font-family:system-ui;background:#f7f3ff;margin:0;color:#25213a}.wrap{max-width:850px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:25px;padding:28px;text-align:center;box-shadow:0 10px 35px #0001}.bar{height:10px;background:#ddd;border-radius:10px}.fill{height:100%;width:5%;background:#7156d8;border-radius:10px}.page{text-align:left;margin:30px 0}.page img{width:100%;border-radius:18px}.page p{font-size:18px;line-height:1.6}audio{width:100%}.btn{display:inline-block;background:#7156d8;color:#fff;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:bold;margin:5px}</style><div class="wrap"><div class="card"><h1>✨ KidsImagination</h1><h2 id="title">Creating your story…</h2><p id="msg">Please keep this page open.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="book"></div></div></div><script>
const id=new URLSearchParams(location.search).get('order'),msg=document.querySelector('#msg'),fill=document.querySelector('#fill'),book=document.querySelector('#book');let n=0;function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function poll(){n++;try{let r=await fetch('/api/story/'+encodeURIComponent(id)),d=await r.json();if(d.status==='ready'){title.textContent=d.title||'Your story is ready! 🎉';msg.textContent='Read, listen and download your personalized story.';fill.style.width='100%';book.innerHTML=d.pages.map(p=>`<section class="page"><img src="${p.imageUrl}"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></section>`).join('')+`<a class="btn" href="${d.pdfUrl}" target="_blank">📥 Download PDF</a>`+(d.audioUrl?`<p><audio controls src="${d.audioUrl}"></audio></p><a class="btn" href="${d.audioUrl}" download>🎧 Download Audiobook</a>`:'');return}if(d.status==='failed'){msg.textContent=d.error||'Generation failed.';return}fill.style.width=Math.min(92,5+n*3)+'%';msg.textContent='Generating story, illustrations and audio…';setTimeout(poll,3000)}catch(e){setTimeout(poll,4000)}}poll();</script>
